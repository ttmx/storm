[package]
name = "storm-update"
version.workspace = true
edition.workspace = true

# Updates from GitHub Releases, shared by the desktop app and stormd: find a
# release, download an asset, verify it (SHA256SUMS + minisign), swap the exe.
[dependencies]
aws-lc-rs = "1"
minisign-verify = "0.2.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }

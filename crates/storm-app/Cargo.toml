[package]
name = "storm-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "storm"
path = "src/main.rs"

# Embeds the app icon and version info into storm.exe (Windows only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
futures = "0.3"
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
# Facade over gpui (gpui-pre =0.3.12), gpui-component 0.9.1 and its icon assets.
gpui-kit = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
storm-client = { version = "0.1.0", path = "../storm-client" }
storm-engine = { path = "../storm-engine" }
storm-proto = { path = "../storm-proto" }
# Self-update (see updater.rs). Its reqwest/rustls/aws-lc/tokio are already in
# the binary via storm-client and librqbit.
storm-update = { path = "../storm-update" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

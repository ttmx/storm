[package]
name = "storm-server"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
storm-engine = { version = "0.1.0", path = "../storm-engine" }
storm-proto = { version = "0.1.0", path = "../storm-proto" }
storm-update = { path = "../storm-update" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
